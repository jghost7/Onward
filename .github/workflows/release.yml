name: Release

# Push a tag like v0.2.7 (matching "## Version" in Onward.toc) and this builds the addon zip,
# runs the tests, and publishes a GitHub release with the changelog entry as its notes, then
# uploads the same zip to CurseForge (project 1808625) as a Beta for WoW Forever.
# Every release carries Onward.zip, so this link always gets the newest build:
#   https://github.com/jghost7/Onward/releases/latest/download/Onward.zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Check the tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' Onward/Onward.toc | tr -d '\r')
          [ "v$toc" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but the TOC says $toc"; exit 1; }
          echo "VERSION=$toc" >> "$GITHUB_ENV"
      - name: Build (runs the tests first)
        run: python tools/package.py
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if (f) exit} f' Onward/CHANGELOG.md | tr -d '\r' > notes.md
          printf '\n**Install:** download `Onward.zip` below and unzip it into `World of Warcraft\_forever_\Interface\AddOns`.\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/Onward-$VERSION.zip" Onward.zip
          gh release create "$GITHUB_REF_NAME" "dist/Onward-$VERSION.zip" Onward.zip \
            --title "Onward $VERSION" --notes-file notes.md
      - name: Upload to CurseForge (Beta, WoW Forever)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {if (f) exit} f' Onward/CHANGELOG.md | tr -d '\r' > cf_notes.md
          python tools/cf_upload.py --project 1808625 --zip "dist/Onward-$VERSION.zip" \
            --name "Onward $VERSION" --changelog cf_notes.md --release-type beta
